name: CI
on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    name: Banco (pgTAP) e jornada completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Sobe o Supabase local (Postgres + Auth + API) com todas as migrações.
      - run: supabase start
      - name: Testes do banco (RLS, permissões, regras)
        run: supabase test db
      - name: Jornada completa contra o Supabase local
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY"
          npm run test:integration
      - if: always()
        run: supabase stop --no-backup
